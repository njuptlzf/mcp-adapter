name: Fork-Only Code Ratio Guard

# Implements Phase 15 CI-03 (modify-to-new ratio check)
# Source: docs/upstream-merge-retrospective.md §3.2.1 + SKILL.md §6.4
# Date: 2026-07-01

on:
  pull_request:
    branches: [main, v1.0]
  push:
    branches: [main]

jobs:
  check-fork-only-ratio:
    name: Check fork-only code ratio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/nicobailon/pi-mcp-adapter.git || true
          git fetch upstream main 2>&1 || echo "::warning::upstream fetch failed; check skipped"

      - name: Count new files vs modified files vs upstream
        id: count
        if: env.UPSTREAM_AVAILABLE == 'true' || hashFiles('.git/FETCH_HEAD') != ''
        run: |
          # If upstream fetch failed, skip with warning
          if ! git rev-parse upstream/main >/dev/null 2>&1; then
            echo "::warning::upstream/main not available; skipping ratio check"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Count new files in this PR (added since fork's main base)
          NEW=$(git diff --name-only --diff-filter=A origin/main...HEAD 2>/dev/null | wc -l || echo "0")
          MODIFIED=$(git diff --name-only --diff-filter=M origin/main...HEAD 2>/dev/null | wc -l || echo "0")
          DELETED=$(git diff --name-only --diff-filter=D origin/main...HEAD 2>/dev/null | wc -l || echo "0")

          echo "new_files=$NEW" >> $GITHUB_OUTPUT
          echo "modified_files=$MODIFIED" >> $GITHUB_OUTPUT
          echo "deleted_files=$DELETED" >> $GITHUB_OUTPUT

          # Skip ratio check for docs/config-only PRs (modifying existing .md
          # files is the correct pattern, not an anti-pattern). The ratio check
          # is designed for code changes — forking out doc edits into new files
          # would create fake docs that don't replace the canonical sources.
          # Also skip if the PR is a CI workflow fix (.yml/.yaml) without
          # touching code — same rationale.
          NON_DOC=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -vE '\.(md|yml|yaml|json|txt)$' | wc -l || echo "0")
          if [ "$NON_DOC" -eq 0 ] && { [ "$MODIFIED" -gt 0 ] || [ "$NEW" -gt 0 ] || [ "$DELETED" -gt 0 ]; }; then
            echo "docs_only=true" >> $GITHUB_OUTPUT
            echo "::notice::PR is docs/config-only (no .ts/.js/.sh changes); skipping modify-to-new ratio check"
          fi

          # Calculate ratio
          if [ "$NEW" -eq 0 ] && [ "$MODIFIED" -gt 0 ]; then
            echo "ratio=999" >> $GITHUB_OUTPUT
            echo "::warning::No new files but $MODIFIED modifications — strongly consider extracting fork-only code to new files"
          else
            RATIO=$(echo "scale=2; $MODIFIED / ($NEW + 1)" | bc)
            echo "ratio=$RATIO" >> $GITHUB_OUTPUT
          fi

      - name: Evaluate ratio
        if: steps.count.outputs.skip != 'true' && steps.count.outputs.docs_only != 'true'
        run: |
          RATIO="${{ steps.count.outputs.ratio }}"
          NEW="${{ steps.count.outputs.new_files }}"
          MODIFIED="${{ steps.count.outputs.modified_files }}"

          echo "## Fork-Only Code Ratio Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| New files in this PR | $NEW |" >> $GITHUB_STEP_SUMMARY
          echo "| Modified files in this PR | $MODIFIED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modify-to-new ratio** | **$RATIO** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target ratio**: ≤ 2.0 (per SKILL.md §6.4)" >> $GITHUB_STEP_SUMMARY

          # Soft check: WARN at >2.0, only fail at >5.0 (extreme case)
          HIGH=$(echo "$RATIO > 2.0" | bc -l)
          EXTREME=$(echo "$RATIO > 5.0" | bc -l)

          if [ "$EXTREME" -eq 1 ]; then
            echo "::error::Modify-to-new ratio is $RATIO (extreme: > 5.0). Strongly consider extracting fork-only code to new files. See SKILL.md §6.3 future-proofing rules."
            echo "❌ **FAIL**: Extreme ratio detected. See SKILL.md §6.3 future-proofing rules:" >> $GITHUB_STEP_SUMMARY
            echo "  - New agent adapter → create \`adapters/<new-agent>.ts\`" >> $GITHUB_STEP_SUMMARY
            echo "  - New test scenario → create \`__tests__/<new-scenario>.test.ts\`" >> $GITHUB_STEP_SUMMARY
            echo "  - New abstract type → extend \`interfaces/agent-api.ts\`" >> $GITHUB_STEP_SUMMARY
            echo "  - New universal helper → create \`adapters/<helper>.ts\`" >> $GITHUB_STEP_SUMMARY
            echo "  - New fork-only doc → create \`docs/<new-topic>.md\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "$HIGH" -eq 1 ]; then
            echo "::warning::Modify-to-new ratio is $RATIO (above target 2.0). Consider whether fork code could be extracted to new files. See SKILL.md §6.4."
            echo "⚠️ **WARNING**: Ratio above target. See SKILL.md §6.3 for future-proofing rules." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "✅ **PASS**: Ratio $RATIO is within target ≤ 2.0" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
