name: Import Region Conflict Detector

# Implements Phase 15.5 CI-05 (v3.2): import-region-conflict-detector
# Source: skills/upstream-merge/SKILL.md §6.6 rule 3 + retrospective §1.3
# Date: 2026-07-02

on:
  pull_request:
    branches: [main, v1.0]

jobs:
  check-import-region:
    name: Detect import-region conflict risks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install --no-save tsx

      - name: Run import-region-detector
        id: check
        run: |
          npx tsx scripts/check-import-region.ts --base origin/main --json > /tmp/import-region.json
          cat /tmp/import-region.json

      - name: Comment on PR
        if: steps.check.outputs.total_findings != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/import-region.json', 'utf8'));
            if (data.total_findings === 0) return;
            const list = data.findings
              .map(f => `- \`${f.file}:${f.line}\` [${f.type}] ${f.message}`)
              .join('\n');
            const body = `## ⚠️ Import Region Conflict Detector (v3.2)

Found **${data.total_findings}** import-region finding(s) in this PR.

${list}

Per SKILL.md §6.6 rule 3: Use \`interfaces/agent-api.ts\` abstractions in core, not direct Pi imports.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              body,
            });
